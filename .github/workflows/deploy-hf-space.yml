name: Deploy to Hugging Face Space

# Copies the app into the Space repo; Hugging Face then builds and runs it.
# Setup (once): add repository secret HF_TOKEN (a Hugging Face token with write access)
# and repository variable HF_SPACE (e.g. SnowyIbrahim/orion-xai).
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - 'deploy/hf-space/**'
      - '.github/workflows/deploy-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and HF_SPACE variable in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build the Space folder
        run: |
          mkdir -p space
          cp deploy/hf-space/Dockerfile deploy/hf-space/README.md deploy/hf-space/Modelfile deploy/hf-space/start.sh space/
          cp -r backend ai-service space/
          rm -f space/backend/prisma/*.db space/backend/.env space/ai-service/.env
          find space -name '__pycache__' -prune -exec rm -rf {} +
          printf 'node_modules\n__pycache__\n*.db\n.env\n' > space/.gitignore
          du -sh space

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed. Watch the build at https://huggingface.co/spaces/${HF_SPACE}"
